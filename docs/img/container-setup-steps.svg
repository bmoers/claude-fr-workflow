<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" width="1180" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/></marker></defs><rect width="1180" height="300" fill="#ffffff"/><text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2328" text-anchor="start">From zero to the first FR</text><rect x="24" y="60" width="216" height="130" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/><text x="38" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">1 · Tokens</text><text x="38" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">claude setup-token</text><text x="38" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">gh auth token</text><text x="38" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">→ one env file, chmod 600</text><line x1="240" y1="125" x2="251" y2="125" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><rect x="252" y="60" width="216" height="130" rx="10" fill="#eaeef2" stroke="#afb8c1" stroke-width="1.5"/><text x="266" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">2 · Image</text><text x="266" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">docker pull ghcr.io/bmoers/</text><text x="266" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">  fr-workflow-autopilot:&lt;tag&gt;</text><text x="266" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">the tag your repo pins</text><line x1="468" y1="125" x2="479" y2="125" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><rect x="480" y="60" width="216" height="130" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="494" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">3 · Start</text><text x="494" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">copy docker/compose.yml</text><text x="494" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">  set image tag and REPO</text><text x="494" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">docker compose up -d</text><line x1="696" y1="125" x2="707" y2="125" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><rect x="708" y="60" width="216" height="130" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="722" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">4 · Check</text><text x="722" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">docker logs -f fr-autopilot</text><text x="722" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">…launched autopilot as &lt;id&gt;</text><text x="722" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">claude agents --json: busy</text><line x1="924" y1="125" x2="935" y2="125" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><rect x="936" y="60" width="216" height="130" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/><text x="950" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">5 · Give it work</text><text x="950" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">card → Building / Ready</text><text x="950" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">assign it to yourself</text><text x="950" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">within a minute: queued</text><text x="24" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#57606a" text-anchor="start">Stop: docker compose stop — sessions end, nothing is lost: the FR state is in git and on GitHub, the autopilot&#x27;s notes in the volume.</text><text x="24" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#57606a" text-anchor="start">Update: when the repository&#x27;s pin moves to a new tag, remove container and volume, set the tag in compose.yml, docker compose up -d.</text></svg>
