<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 668" width="1180" height="668" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/></marker></defs><rect width="1180" height="668" fill="#ffffff"/><text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2328" text-anchor="start">What runs where</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#57606a" text-anchor="start">One container per repository and account. It holds the tools; the repository, its profile and the plugin arrive at runtime.</text><rect x="24" y="80" width="700" height="550" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="40" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#57606a" text-anchor="start">Your laptop (or a server)</text><rect x="40" y="124" width="210" height="92" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/><text x="54" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Env file, chmod 600</text><text x="54" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#57606a" text-anchor="start">CLAUDE_CODE_OAUTH_TOKEN</text><text x="54" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#57606a" text-anchor="start">GH_TOKEN</text><text x="54" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#57606a" text-anchor="start">never in the image, never in git</text><rect x="40" y="236" width="668" height="364" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="6 4"/><text x="56" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Docker container  fr-workflow-autopilot:&lt;tag&gt;</text><text x="56" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">Claude Code (pinned) · gh · git · jq · Chromium under Xvfb · user pwuser</text><rect x="56" y="296" width="240" height="128" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="70" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Entrypoint (keep-alive)</text><text x="70" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#57606a" text-anchor="start">gh login · clone · trust</text><text x="70" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#57606a" text-anchor="start">per-machine profile</text><text x="70" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#57606a" text-anchor="start">plugin at the repo&#x27;s pinned tag</text><text x="70" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#57606a" text-anchor="start">every 5 min: fr.sh launch autopilot</text><rect x="320" y="296" width="372" height="128" rx="10" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/><text x="334" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Claude Code daemon</text><text x="334" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#57606a" text-anchor="start">autopilot session  (/fr-workflow:autopilot --loop)</text><text x="334" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#57606a" text-anchor="start">  reads the board, starts and watches sessions</text><text x="334" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#57606a" text-anchor="start">implementation session  → ship session</text><text x="334" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#57606a" text-anchor="start">  each in its own worktree of the clone</text><line x1="296" y1="360" x2="318" y2="360" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><text x="307" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle">launch</text><rect x="56" y="448" width="636" height="132" rx="10" fill="#eaeef2" stroke="#afb8c1" stroke-width="1.5"/><text x="70" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Volume  /home/pwuser  (survives restarts)</text><text x="70" y="494" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">~/work/&lt;repo&gt;            the clone; FR worktrees under .claude/worktrees/</text><text x="70" y="512" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">~/.claude                sessions, the plugin cache, the local FR log, user settings (autoMode)</text><text x="70" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">~/.claude.json           trust for the clone and ~/work</text><text x="70" y="548" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">.claude/workflow.local.md   autopilot_assignee, attach_command — this machine&#x27;s values</text><line x1="145" y1="216" x2="145" y2="234" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><text x="250" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle">tokens, as environment</text><rect x="760" y="80" width="396" height="300" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="776" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#57606a" text-anchor="start">GitHub</text><rect x="776" y="122" width="364" height="84" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="790" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Repository</text><text x="790" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">branches and their commits, pull requests, CI,</text><text x="790" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">the ruleset that merges</text><rect x="776" y="214" width="364" height="84" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="790" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Issues and board</text><text x="790" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">FR issues (label fr), Phase × Status,</text><text x="790" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">stop comments and your answers</text><rect x="776" y="306" width="364" height="62" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="790" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">GHCR</text><text x="790" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">ghcr.io/bmoers/fr-workflow-autopilot:&lt;tag&gt;, pulled once</text><rect x="760" y="400" width="396" height="90" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="776" y="426" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#57606a" text-anchor="start">Anthropic</text><rect x="776" y="440" width="364" height="40" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="790" y="464" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Model requests on your subscription (the setup token)</text><rect x="760" y="510" width="396" height="120" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="776" y="536" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#57606a" text-anchor="start">Your channel</text><rect x="776" y="548" width="364" height="72" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/><text x="790" y="572" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">notify_command → chat, webhook, ntfy …</text><text x="790" y="594" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">every stop, with how to answer: the attach</text><text x="790" y="612" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">command or the comment to write</text><line x1="708" y1="318" x2="758" y2="162" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><line x1="708" y1="336" x2="758" y2="248" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><line x1="758" y1="332" x2="708" y2="354" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><line x1="708" y1="372" x2="758" y2="460" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><line x1="708" y1="392" x2="758" y2="578" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><text x="24" y="650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">Arrows: git and gh with GH_TOKEN · the image pulled once · model requests with the setup token · notify_command to your channel. Nothing listens: the container only calls out.</text></svg>
