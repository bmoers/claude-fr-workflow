<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/></marker></defs><rect width="1180" height="560" fill="#ffffff"/><text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2328" text-anchor="start">An FR through the container</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#57606a" text-anchor="start">Top: what the container does. Bottom: the only three places where a person acts.</text><rect x="24" y="76" width="1132" height="230" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="40" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#57606a" text-anchor="start">Container</text><rect x="24" y="330" width="1132" height="200" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="40" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#57606a" text-anchor="start">You</text><rect x="40" y="116" width="178" height="150" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="54" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Queue</text><text x="54" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">card on Building / Ready,</text><text x="54" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">assigned to you</text><text x="54" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">→ taken within a minute</text><line x1="218" y1="190" x2="227" y2="190" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><rect x="228" y="116" width="178" height="150" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="242" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Start</text><text x="242" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">branch and worktree</text><text x="242" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">FR doc from the issue</text><text x="242" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">board: Building / Running</text><line x1="406" y1="190" x2="415" y2="190" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><rect x="416" y="116" width="178" height="150" rx="10" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/><text x="430" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Implement</text><text x="430" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">a session writes the code</text><text x="430" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">commits, never pushes</text><text x="430" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">hand-off: Review / Ready</text><line x1="594" y1="190" x2="603" y2="190" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><rect x="604" y="116" width="178" height="150" rx="10" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/><text x="618" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Ship: reviews</text><text x="618" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">code, security and silent-</text><text x="618" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">failure reviews, triaged</text><text x="618" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">by the FR; stop → comment</text><line x1="782" y1="190" x2="791" y2="190" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><rect x="792" y="116" width="178" height="150" rx="10" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/><text x="806" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Ship: PR</text><text x="806" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">push, PR, CI, acceptance</text><text x="806" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">fr.sh merge: auto-merge on</text><text x="806" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">the ruleset merges</text><line x1="970" y1="190" x2="979" y2="190" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><rect x="980" y="116" width="178" height="150" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/><text x="994" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Finish</text><text x="994" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">worktree and branch gone</text><text x="994" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">board: Done / Complete</text><text x="994" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">issue closed by the PR</text><rect x="40" y="372" width="300" height="130" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/><text x="54" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">1 · Hand it over</text><text x="54" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">Move the card to Building / Ready</text><text x="54" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">and assign it to the login the</text><text x="54" y="454" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">container serves. Nothing else</text><text x="54" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">starts an FR.</text><rect x="430" y="372" width="330" height="130" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/><text x="444" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">2 · Answer a stop</text><text x="444" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">A comment on the FR issue:</text><text x="444" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">accept all · accept 1,3 · fix 2 · abort</text><text x="444" y="454" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">(or join the session with the attach</text><text x="444" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">command the notification carries)</text><rect x="850" y="372" width="290" height="130" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/><text x="864" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">3 · Watch</text><text x="864" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">Board, pull request, chat.</text><text x="864" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">docker exec fr-autopilot claude agents --json</text><text x="864" y="454" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">docker exec fr-autopilot claude logs &lt;id&gt;</text><line x1="190" y1="370" x2="129" y2="268" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><text x="200" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">you move and assign the card</text><line x1="664" y1="268" x2="520" y2="370" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><text x="610" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="end">stop comment, notify_command</text><line x1="640" y1="370" x2="724" y2="268" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><text x="690" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">your comment, read within a minute</text></svg>
